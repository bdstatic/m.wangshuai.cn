        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        :root {
            --primary: #187878;

            --text-dark: #222;

            --bg-soft: #f7f8fa;

        html, body {

        body {

        .card {

            margin: 0 auto;
            background: var(--bg-card);
            border-radius: var(--radius-card);
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);

        /* ===== 顶部头部区域 ===== */

            text-align: center;
            padding: 40px 20px 32px;
            position: relative;
        }

        .header::after {
            content: "";
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 24px;
            background: var(--bg-card);
            border-radius: 24px 24px 0 0;
        }

        .avatar-wrap {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 16px;
            z-index: 1;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.95);
            object-fit: cover;
            display: block;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);

        .name {

            letter-spacing: 2px;

            position: relative;
            z-index: 1;
        }

            position: relative;
            z-index: 1;
        }

            opacity: 0.85;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            position: relative;
            z-index: 1;

            height: 16px;
            fill: currentColor;
        }

            text-align: center;
            font-size: 15px;
            color: var(--text-body);
            line-height: 1.75;
        }

        /* ===== 按钮区域 ===== */

            padding: 0 24px;
        }

        .btn {
            width: 100%;
            height: 56px;
            border-radius: var(--radius-btn);
            border: none;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            text-decoration: none;
            margin-bottom: 12px;
            min-height: 44px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .btn-call {
            background: linear-gradient(135deg, #ff7a33 0%, #ff5500 100%);

        }

        .btn-wechat {

        /* ===== 联系方式文字 ===== */
        .contact-text {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 8px 24px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .contact-text .divider {

            height: 12px;
            background: #ddd;

        /* ===== 业务标签 ===== */

            font-size: 13px;
            color: var(--text-muted);
            padding: 0 28px 10px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .tags-wrap {
            display: flex;
            gap: 10px;
            padding: 0 24px 24px;
            flex-wrap: wrap;
        }

        .tag {
            background: var(--primary-light);
            color: var(--primary);
            padding: 7px 16px;
            border-radius: var(--radius-tag);
            font-size: 14px;
            font-weight: 500;
        }

        /* ===== 服务优势四格 ===== */
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 24px 28px;
        }

        .feature-item {

            border-radius: 12px;
            border: 1px solid #f0f0f0;

        .feature-icon {

        /* ===== 底部提示 ===== */

        /* ===== Toast 提示 ===== */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            max-width: 80%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* ===== 响应式 ===== */

            .features { gap: 10px; }
            .feature-item { padding: 14px 12px; }

    <script>
        // 复制微信号
        function copyWechat() {
            var wechat = "+8617503962297";
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(wechat).then(function() {
                    showToast("微信号复制成功，去微信添加好友吧");
                }).catch(function() {
                    fallbackCopy(wechat);
                });
            } else {
                fallbackCopy(wechat);
            }
        }

        // 兼容旧浏览器的复制方式
        function fallbackCopy(text) {
            var textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand("copy");
                showToast("微信号复制成功，去微信添加好友吧");
            } catch (e) {
                showToast("复制失败，请手动复制：" + text);
            }
            document.body.removeChild(textarea);
        }

        // 显示 Toast 提示
        function showToast(message) {
            var toast = document.getElementById("toast");
            toast.textContent = message;
            toast.classList.add("show");
            setTimeout(function() {
                toast.classList.remove("show");
            }, 2000);
        }
    </script>
